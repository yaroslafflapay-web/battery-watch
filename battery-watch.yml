name: Battery watch

on:
  schedule:
    - cron: "*/15 * * * *"   # каждые ~15 минут (GitHub может задерживать запуск на несколько минут, особенно в пиковые часы)
  workflow_dispatch: {}       # кнопка ручного запуска в интерфейсе GitHub — удобно для первого теста

permissions:
  contents: write   # нужно, чтобы workflow мог закоммитить state.json обратно в репозиторий

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run battery check
        env:
          DESS_API_URL: ${{ secrets.DESS_API_URL }}
          DESS_AUTH_HEADER: ${{ secrets.DESS_AUTH_HEADER }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SOC_PARAM_ID: "bt_battery_capacity"
          LOW_THRESHOLD: "25"
          RECOVER_THRESHOLD: "40"
          SHELLY_ACTION_URL: ${{ secrets.SHELLY_ACTION_URL }}
        run: python3 battery_watch.py

      - name: Commit state if changed
        run: |
          git config user.name "battery-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "update state"
          git push
