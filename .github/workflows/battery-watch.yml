name: Battery watch

on:
  schedule:
    - cron: "*/15 * * * *"   # РєР°Р¶РґС‹Рµ ~15 РјРёРЅСѓС‚ (GitHub РјРѕР¶РµС‚ Р·Р°РґРµСЂР¶РёРІР°С‚СЊ Р·Р°РїСѓСЃРє РЅР° РЅРµСЃРєРѕР»СЊРєРѕ РјРёРЅСѓС‚, РѕСЃРѕР±РµРЅРЅРѕ РІ РїРёРєРѕРІС‹Рµ С‡Р°СЃС‹)
  workflow_dispatch: {}       # РєРЅРѕРїРєР° СЂСѓС‡РЅРѕРіРѕ Р·Р°РїСѓСЃРєР° РІ РёРЅС‚РµСЂС„РµР№СЃРµ GitHub вЂ” СѓРґРѕР±РЅРѕ РґР»СЏ РїРµСЂРІРѕРіРѕ С‚РµСЃС‚Р°

permissions:
  contents: write   # РЅСѓР¶РЅРѕ, С‡С‚РѕР±С‹ workflow РјРѕРі Р·Р°РєРѕРјРјРёС‚РёС‚СЊ state.json РѕР±СЂР°С‚РЅРѕ РІ СЂРµРїРѕР·РёС‚РѕСЂРёР№

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run battery check
        env:
          DESS_API_URL: ${{ secrets.DESS_API_URL }}
          DESS_AUTH_HEADER: ${{ secrets.DESS_AUTH_HEADER }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SOC_PARAM_ID: "bt_battery_capacity"
          LOW_THRESHOLD: "25"
          RECOVER_THRESHOLD: "40"
          SHELLY_ACTION_URL: ${{ secrets.SHELLY_ACTION_URL }}
        run: python3 battery_watch.py

      - name: Commit state if changed
        run: |
          git config user.name "battery-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "update state"
          git push
